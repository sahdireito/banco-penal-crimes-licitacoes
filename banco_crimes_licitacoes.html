<script>
const QUESTOES = [{"num": 1, "exame": "OAB – estilo FGV", "titulo": "Migração dos Crimes Licitatórios para o Código Penal", "enunciado": "A Lei 14.133/2021 (Nova Lei de Licitações e Contratos Administrativos) trouxe mudanças profundas na disciplina penal aplicável às licitações.", "comando": "Sobre essas mudanças, assinale a alternativa correta.", "alt": {"A": "Os crimes licitatórios continuam previstos exclusivamente na Lei 8.666/93, que segue plenamente vigente para todos os efeitos.", "B": "Os artigos 89 a 108 da Lei 8.666/93 (que tratavam da parte penal e processual penal) foram revogados de imediato, e os crimes em licitações e contratos administrativos passaram a constar do Código Penal, nos arts. 337-E a 337-P, dentro do Título XI (Crimes contra a Administração Pública).", "C": "Os crimes licitatórios foram descriminalizados, passando a constituir apenas infrações administrativas.", "D": "A Lei 14.133/2021 criou uma lei penal especial autônoma, sem qualquer alteração do Código Penal."}, "gabarito": "B", "fb": {"A": "Incorreta. Os arts. 89 a 108 da Lei 8.666/93 (parte penal e processual penal) foram REVOGADOS DE IMEDIATO pela Lei 14.133/2021 (art. 193, I), diferentemente do restante da lei antiga, que teve período de transição.", "B": "Correta! O art. 178 da Lei 14.133/2021 inseriu no Código Penal o Capítulo II-B (“Dos Crimes em Licitações e Contratos Administrativos”), dentro do Título XI (Crimes contra a Administração Pública), compreendendo os arts. 337-E a 337-P. Os antigos arts. 89 a 108 da Lei 8.666/93 foram revogados de imediato (art. 193, I, Lei 14.133/2021).", "C": "Incorreta. Não houve descriminalização — pelo contrário, muitas condutas tiveram suas penas AUMENTADAS na migração para o Código Penal.", "D": "Incorreta. A opção legislativa foi justamente inserir os crimes DENTRO do Código Penal, e não criar uma lei penal extravagante autônoma."}, "fund": "Art. 178 e art. 193, I, Lei 14.133/2021; arts. 337-E a 337-P, CP.", "caqui": "Esse é O ponto de partida obrigatório do tema: antes de 2021, os crimes licitatórios ficavam nos arts. 89 a 108 da Lei 8.666/93. Hoje, ELES ESTÃO DENTRO DO PRÓPRIO CÓDIGO PENAL, no Título XI (Crimes contra a Administração Pública), arts. 337-E a 337-P. Se uma questão mencionar “art. 89 da Lei 8.666/93” como se ainda estivesse em vigor, desconfie — hoje a conduta equivalente está no art. 337-E do CP."}, {"num": 2, "exame": "CESPE – estilo", "titulo": "Contratação Direta Ilegal – Art. 337-E, CP", "enunciado": "Um servidor público, responsável por processo de contratação, admite e possibilita a contratação direta de uma empresa, fora das hipóteses de dispensa ou inexigibilidade previstas em lei.", "comando": "Segundo o Código Penal, essa conduta configura o crime de:", "alt": {"A": "Frustração do caráter competitivo de licitação (art. 337-F, CP), com pena de reclusão de 4 a 8 anos.", "B": "Contratação direta ilegal (art. 337-E, CP): “admitir, possibilitar ou dar causa à contratação direta fora das hipóteses previstas em lei”, com pena de reclusão de 4 a 8 anos e multa.", "C": "Perturbação de processo licitatório (art. 337-I, CP), com pena de reclusão de 6 meses a 3 anos.", "D": "Contratação inidônea (art. 337-M, CP)."}, "gabarito": "B", "fb": {"A": "Incorreta. A frustração do caráter competitivo pressupõe a EXISTÊNCIA de um certame que é fraudado — aqui, o problema é justamente a CONTRATAÇÃO DIRETA fora das hipóteses legais, sem licitação alguma.", "B": "Correta! Art. 337-E, CP: “Admitir, possibilitar ou dar causa à contratação direta fora das hipóteses previstas em lei: Pena – reclusão, de 4 (quatro) a 8 (oito) anos, e multa”. A pena foi elevada em relação ao antigo art. 89 da Lei 8.666/93, que previa detenção de 3 a 5 anos.", "C": "Incorreta. A perturbação de processo licitatório pressupõe a existência de um processo licitatório em curso sendo perturbado, não a contratação direta indevida.", "D": "Incorreta. Contratação inidônea trata de admitir à licitação ou contratar com empresa/profissional declarado inidôneo, situação diversa da narrada."}, "fund": "Art. 337-E, CP, incluído pela Lei 14.133/2021.", "caqui": "Esse é o “sucessor” direto do famoso art. 89 da antiga Lei 8.666/93 (“dispensa ou inexigibilidade indevida”). Mudanças importantes: (1) a pena SUBIU de detenção 3-5 anos para RECLUSÃO 4-8 anos; (2) a jurisprudência do STJ, já consolidada para o art. 89 antigo, exige DOLO ESPECÍFICO de causar dano ao erário E efetivo PREJUÍZO aos cofres públicos — entendimento que tende a se manter para o novo art. 337-E; (3) deixou de ser crime o mero descumprimento de FORMALIDADES da contratação (abolitio criminis parcial em relação à segunda parte do antigo art. 89)."}, {"num": 3, "exame": "OAB – estilo FGV", "titulo": "Frustração do Caráter Competitivo – Art. 337-F, CP", "enunciado": "Dois licitantes concorrentes se reúnem previamente e combinam os preços que cada um apresentará no certame, de modo a garantir que um deles vença a licitação com margem de lucro maior.", "comando": "Essa conduta, tipicamente conhecida como “combinação de propostas” ou “cartel em licitação”, configura o crime de:", "alt": {"A": "Contratação direta ilegal (art. 337-E, CP).", "B": "Frustração do caráter competitivo de licitação (art. 337-F, CP): frustrar ou fraudar, com o intuito de obter vantagem decorrente da adjudicação do objeto, o caráter competitivo do processo licitatório.", "C": "Violação de sigilo em licitação (art. 337-J, CP).", "D": "Omissão grave de dado ou informação por projetista (art. 337-O, CP)."}, "gabarito": "B", "fb": {"A": "Incorreta. Aqui HÁ licitação formal em curso — o problema é a fraude ao caráter competitivo dela, não uma contratação direta sem licitação.", "B": "Correta! Art. 337-F, CP, pune exatamente o conluio entre licitantes que combinam preços ou condições para fraudar a competitividade do certame, com o intuito de obter vantagem na adjudicação — pena de reclusão de 4 a 8 anos e multa. O crime se consuma independentemente de o conluio efetivamente resultar na vitória do licitante combinado.", "C": "Incorreta. Não há devassamento de sigilo de proposta — os próprios licitantes combinaram entre si, o que é conduta distinta.", "D": "Incorreta. Não há questão relacionada a levantamento cadastral de projeto de engenharia neste caso."}, "fund": "Art. 337-F, CP, incluído pela Lei 14.133/2021.", "caqui": "Esse é o crime mais associado ao popular “combinado” ou “jogo de cartas marcadas” em licitações. Detalhe importante: o simples ACORDO para fraudar a competição já configura o crime, independentemente de o conluio vencer ou não a licitação — é crime FORMAL quanto a esse aspecto, bastando a intenção de frustrar a competitividade em busca de vantagem."}, {"num": 4, "exame": "CESPE – estilo", "titulo": "Patrocínio de Contratação Indevida – Art. 337-G, CP", "enunciado": "Um agente, sem integrar formalmente o processo licitatório, patrocina, direta ou indiretamente, interesse privado perante a Administração Pública, dando causa à instauração de licitação ou à celebração de contrato cuja invalidação venha a ser reconhecida judicialmente.", "comando": "Essa conduta configura o crime de:", "alt": {"A": "Patrocínio de contratação indevida (art. 337-G, CP), figura análoga à antiga “advocacia administrativa” em matéria de licitações.", "B": "Corrupção ativa (art. 333, CP), exclusivamente.", "C": "Tráfico de influência (art. 332, CP), exclusivamente, afastando qualquer aplicação dos crimes licitatórios.", "D": "Fraude em licitação ou contrato (art. 337-L, CP)."}, "gabarito": "A", "fb": {"A": "Correta! Art. 337-G, CP, tipifica o patrocínio de interesse privado perante a Administração Pública que dá causa à instauração de licitação ou celebração de contrato posteriormente invalidado judicialmente — é uma espécie de “advocacia administrativa” especializada em matéria de licitações e contratos.", "B": "Incorreta. Corrupção ativa exige oferecimento/promessa de vantagem indevida a funcionário público — elemento não descrito no enunciado, que fala apenas em “patrocinar interesse privado”.", "C": "Incorreta. Embora haja proximidade conceitual com o tráfico de influência, quando a conduta específica envolve licitações e contratos administrativos com os elementos do art. 337-G, aplica-se esse tipo específico (princípio da especialidade), sem excluir a possível discussão de concurso com outros tipos em situações distintas.", "D": "Incorreta. A fraude em licitação/contrato do art. 337-L envolve entrega de mercadoria/serviço diverso do contratado — conduta distinta do patrocínio de interesse privado."}, "fund": "Art. 337-G, CP, incluído pela Lei 14.133/2021.", "caqui": "Pense no art. 337-G como a versão “licitatória” da advocacia administrativa: alguém usa sua proximidade ou influência para “empurrar” uma licitação ou contrato que, no fim das contas, acaba sendo invalidado pela Justiça por vício de origem. A pena é sensivelmente menor que a dos crimes mais graves do capítulo (como contratação direta ilegal ou frustração do caráter competitivo, ambos com 4 a 8 anos), refletindo menor gravidade da conduta — mais próxima de um “intermediário” do que do autor direto da fraude."}, {"num": 5, "exame": "OAB – estilo FGV", "titulo": "Modificação ou Pagamento Irregular em Contrato – Art. 337-H, CP", "enunciado": "Um gestor público autoriza a prorrogação de um contrato administrativo, sem qualquer amparo em lei, no edital ou no instrumento contratual, favorecendo indevidamente o contratado.", "comando": "Segundo o Código Penal, essa conduta configura o crime de:", "alt": {"A": "Perturbação de processo licitatório (art. 337-I, CP).", "B": "Modificação ou pagamento irregular em contrato administrativo (art. 337-H, CP): admitir, possibilitar ou dar causa a modificação ou vantagem, inclusive prorrogação contratual, sem autorização legal, no edital ou nos instrumentos contratuais.", "C": "Contratação inidônea (art. 337-M, CP).", "D": "Impedimento indevido (art. 337-N, CP)."}, "gabarito": "B", "fb": {"A": "Incorreta. A perturbação do processo licitatório ocorre na FASE da licitação, não na execução do contrato já celebrado.", "B": "Correta! Art. 337-H, CP: pune também o pagamento de fatura com preterição da ordem cronológica de exigibilidade. A pena foi elevada de 2-4 anos (antigo art. 92, Lei 8.666/93) para reclusão de 4 a 8 anos e multa.", "C": "Incorreta. Contratação inidônea trata de contratar com empresa declarada inidônea/impedida, situação diversa.", "D": "Incorreta. Impedimento indevido está relacionado a registros cadastrais de licitantes, não a modificações contratuais indevidas."}, "fund": "Art. 337-H, CP, incluído pela Lei 14.133/2021.", "caqui": "Esse tipo abrange DUAS condutas distintas em um só artigo: (1) modificar/dar vantagem indevida no contrato (inclusive prorrogação) sem base legal; e (2) pagar fatura fora da ORDEM CRONOLÓGICA de exigibilidade (furando a fila de pagamentos em benefício de um fornecedor específico). Ambas tiveram suas penas SIGNIFICATIVAMENTE aumentadas em relação à legislação anterior — de 2-4 anos para 4-8 anos de reclusão."}, {"num": 6, "exame": "CESPE – estilo", "titulo": "Perturbação de Processo Licitatório – Art. 337-I, CP", "enunciado": "Durante a sessão pública de abertura de propostas de uma licitação, um participante tenta, sem sucesso, atrapalhar deliberadamente o andamento do ato, gerando tumulto e confusão.", "comando": "Segundo o Código Penal, essa conduta:", "alt": {"A": "Não configura crime, pois a tentativa de perturbação sem sucesso é conduta atípica.", "B": "Configura o crime de perturbação de processo licitatório (art. 337-I, CP), que pune inclusive a TENTATIVA de fraudar a realização de ato do processo licitatório, com pena de reclusão de 6 meses a 3 anos.", "C": "Configura o crime de frustração do caráter competitivo (art. 337-F, CP), com pena idêntica à de contratação direta ilegal.", "D": "Configura contravenção penal, sujeita apenas a prisão simples."}, "gabarito": "B", "fb": {"A": "Incorreta. O próprio tipo penal do art. 337-I pune expressamente “perturbar, fraudar ou tentar fraudar” — a tentativa JÁ está abrangida na própria descrição típica.", "B": "Correta! Art. 337-I, CP: “Perturbar, fraudar ou tentar fraudar a realização de qualquer ato de processo licitatório: Pena – reclusão, de 6 (seis) meses a 3 (três) anos, e multa”. A pena foi elevada em relação ao antigo art. 93 da Lei 8.666/93, que previa detenção de 6 meses a 2 anos.", "C": "Incorreta. As penas são BEM diferentes: 337-I (6 meses a 3 anos) é significativamente mais branda que 337-F (4 a 8 anos).", "D": "Incorreta. É crime, não contravenção, expressamente tipificado no Código Penal."}, "fund": "Art. 337-I, CP, incluído pela Lei 14.133/2021.", "caqui": "Repare que o próprio verbo do tipo já inclui “tentar fraudar” — isso significa que a tentativa de perturbar já está na descrição do crime consumado, dispensando a aplicação da regra geral de tentativa (art. 14, II, CP, com redução de pena). É uma técnica legislativa que a FGV gosta de explorar: quando o verbo já inclui a tentativa no próprio tipo, não se aplica o redutor de pena da tentativa."}, {"num": 7, "exame": "OAB – estilo FGV", "titulo": "Violação de Sigilo em Licitação – Art. 337-J, CP", "enunciado": "Um servidor público, com acesso privilegiado ao sistema de licitações, revela a um licitante o conteúdo da proposta de seu concorrente, antes da abertura oficial dos envelopes.", "comando": "Essa conduta configura o crime de:", "alt": {"A": "Violação de sigilo em licitação (art. 337-J, CP): devassar o sigilo de proposta apresentada em processo licitatório ou proporcionar a terceiro o ensejo de devassá-lo.", "B": "Peculato (art. 312, CP), exclusivamente, afastando a aplicação dos crimes licitatórios específicos.", "C": "Contratação direta ilegal (art. 337-E, CP).", "D": "Modificação ou pagamento irregular em contrato administrativo (art. 337-H, CP)."}, "gabarito": "A", "fb": {"A": "Correta! Art. 337-J, CP, tipifica especificamente a conduta de devassar (ou proporcionar a terceiro o ensejo de devassar) o sigilo de proposta em processo licitatório — exatamente a situação do servidor que revela antecipadamente o conteúdo da proposta concorrente.", "B": "Incorreta. Embora possa haver alguma proximidade conceitual com a violação de dever funcional, existindo tipo específico para a conduta licitatória (princípio da especialidade), aplica-se o art. 337-J.", "C": "Incorreta. Não há contratação direta envolvida — a licitação formal está em curso, com propostas sigilosas sendo indevidamente reveladas.", "D": "Incorreta. Não há questão contratual em execução — o fato ocorre ainda na fase de propostas da licitação."}, "fund": "Art. 337-J, CP, incluído pela Lei 14.133/2021.", "caqui": "Esse crime protege especificamente o SIGILO DAS PROPOSTAS, elemento essencial para a isonomia e competitividade do certame. Vazar o conteúdo de uma proposta concorrente dá vantagem desleal e distorce toda a lógica da disputa — por isso a lei criou um tipo penal específico e autônomo para essa conduta, distinto dos demais crimes contra a Administração Pública em geral."}, {"num": 8, "exame": "CESPE – estilo", "titulo": "Afastamento de Licitante – Art. 337-K, CP", "enunciado": "Um representante de empresa concorrente ameaça gravemente outro licitante para que ele desista de participar de determinada licitação, reduzindo a competição pelo objeto licitado.", "comando": "Segundo o Código Penal, essa conduta configura o crime de:", "alt": {"A": "Afastamento de licitante (art. 337-K, CP): afastar ou procurar afastar licitante por meio de violência, grave ameaça, fraude ou oferecimento de vantagem, com pena de reclusão de 3 a 5 anos.", "B": "Constrangimento ilegal (art. 146, CP), exclusivamente, afastando a aplicação dos crimes licitatórios.", "C": "Frustração do caráter competitivo de licitação (art. 337-F, CP), com pena idêntica.", "D": "Violação de sigilo em licitação (art. 337-J, CP)."}, "gabarito": "A", "fb": {"A": "Correta! Art. 337-K, CP: pune quem afasta ou procura afastar licitante por violência, grave ameaça, fraude ou oferecimento de vantagem de qualquer tipo. A pena foi elevada de 2-4 anos (antigo art. 95, Lei 8.666/93) para reclusão de 3 a 5 anos.", "B": "Incorreta. Existindo tipo penal específico para a conduta no contexto licitatório (princípio da especialidade), aplica-se o art. 337-K, não o crime genérico de constrangimento ilegal.", "C": "Incorreta. As penas são diferentes: 337-F prevê reclusão de 4 a 8 anos, enquanto 337-K prevê reclusão de 3 a 5 anos — condutas e apenamentos distintos.", "D": "Incorreta. Não há questão de sigilo de proposta envolvida, mas sim coação direta contra um licitante específico."}, "fund": "Art. 337-K, CP, incluído pela Lei 14.133/2021.", "caqui": "Repare os quatro meios alternativos previstos no tipo: violência, grave ameaça, FRAUDE, ou OFERECIMENTO DE VANTAGEM. Ou seja, tanto “ameaçar” quanto “subornar” um concorrente para que ele desista de disputar a licitação se enquadram nesse mesmo tipo penal — o bem jurídico protegido é a AMPLA COMPETITIVIDADE do certame, agredida tanto pela coerção quanto pela corrupção do concorrente."}, {"num": 9, "exame": "OAB – estilo FGV", "titulo": "Fraude em Licitação ou Contrato – Art. 337-L, CP", "enunciado": "Uma empresa contratada para fornecer determinado equipamento entrega, em substituição ao produto contratado, mercadoria de qualidade inferior, sem que a Administração Pública tenha percebido a substituição.", "comando": "Segundo o Código Penal, essa conduta configura o crime de:", "alt": {"A": "Estelionato (art. 171, CP), exclusivamente, sem qualquer relação com os crimes licitatórios.", "B": "Fraude em licitação ou contrato (art. 337-L, CP): fraudar, em prejuízo da Administração Pública, licitação ou contrato dela decorrente, mediante entrega de mercadoria com qualidade diversa da contratada, com pena de reclusão de 4 a 8 anos.", "C": "Contratação direta ilegal (art. 337-E, CP).", "D": "Patrocínio de contratação indevida (art. 337-G, CP)."}, "gabarito": "B", "fb": {"A": "Incorreta. Existindo tipo penal específico e mais grave para a conduta em contexto licitatório, aplica-se o art. 337-L (princípio da especialidade), não o estelionato genérico.", "B": "Correta! Art. 337-L, CP, elenca várias hipóteses de fraude contratual: entrega de mercadoria ou prestação de serviços com qualidade/quantidade diversa da contratada, fornecimento de mercadoria falsificada ou deteriorada, entrega de uma mercadoria por outra, alteração de substância/qualidade/quantidade, entre outras. A pena subiu de 3-6 anos (antigo art. 96, Lei 8.666/93) para reclusão de 4 a 8 anos.", "C": "Incorreta. Há contrato regularmente celebrado; o problema é o descumprimento fraudulento na EXECUÇÃO, não na forma de contratação.", "D": "Incorreta. Não há patrocínio de interesse privado na instauração da licitação — a fraude ocorre na entrega do objeto contratado."}, "fund": "Art. 337-L, I a V, CP, incluído pela Lei 14.133/2021.", "caqui": "NOVIDADE importante: diferente do antigo art. 96 da Lei 8.666/93 (que a jurisprudência do STF/STJ restringia a contratos de AQUISIÇÃO OU VENDA DE BENS/MERCADORIAS), o novo art. 337-L ELIMINOU essa restrição do caput e passou a mencionar expressamente SERVIÇOS no inciso IV. Isso significa que a jurisprudência antiga que limitava o crime a bens/mercadorias deve ser SUPERADA para fatos ocorridos após a vigência da Lei 14.133/2021 — agora o crime também alcança fraude na prestação de SERVIÇOS contratados com a Administração."}, {"num": 10, "exame": "CESPE – estilo", "titulo": "Contratação Inidônea – Art. 337-M, CP", "enunciado": "Um gestor público admite à licitação uma empresa que já havia sido formalmente declarada inidônea para contratar com a Administração Pública.", "comando": "Segundo o Código Penal, essa conduta configura o crime de:", "alt": {"A": "Fraude em licitação ou contrato (art. 337-L, CP).", "B": "Contratação inidônea (art. 337-M, CP): admitir à licitação ou celebrar contrato com empresa ou profissional declarado inidôneo.", "C": "Perturbação de processo licitatório (art. 337-I, CP).", "D": "Violação de sigilo em licitação (art. 337-J, CP)."}, "gabarito": "B", "fb": {"A": "Incorreta. A fraude do art. 337-L envolve descumprimento na entrega do objeto contratado, não a admissão de empresa inidônea ao certame.", "B": "Correta! Art. 337-M, CP: pune quem admite à licitação ou celebra contrato com empresa ou profissional declarado inidôneo. O §1º estende a punição à celebração de contrato com empresa ou profissional declarado IMPEDIDO de licitar ou contratar com a Administração.", "C": "Incorreta. Não há perturbação do ato licitatório em si, mas admissão irregular de participante impedido.", "D": "Incorreta. Não há questão de sigilo de propostas envolvida."}, "fund": "Art. 337-M, caput e §1º, CP, incluído pela Lei 14.133/2021.", "caqui": "Esse crime protege a integridade dos CADASTROS DE IMPEDIMENTO/INIDONEIDADE (como o CEIS — Cadastro Nacional de Empresas Inidôneas e Suspensas). De nada adiantaria a Administração declarar uma empresa inidônea em um processo administrativo, se um gestor pudesse simplesmente “fechar os olhos” e contratar essa mesma empresa em outro processo sem qualquer consequência penal. Note que há DUAS situações no artigo: empresa INIDÔNEA (caput) e empresa IMPEDIDA (§1º) — são classificações técnicas distintas na Lei 14.133/2021."}, {"num": 11, "exame": "OAB – estilo FGV", "titulo": "Impedimento Indevido – Art. 337-N, CP", "enunciado": "Um servidor responsável pelo cadastro de fornecedores da Administração promove, sem justificativa legal, o cancelamento indevido do registro cadastral de uma empresa regularmente inscrita, impedindo-a de participar de futuras licitações.", "comando": "Segundo o Código Penal, essa conduta pode configurar o crime de:", "alt": {"A": "Impedimento indevido (art. 337-N, CP), relacionado a irregularidades na inscrição, alteração, suspensão ou cancelamento de registros cadastrais de licitantes.", "B": "Contratação inidônea (art. 337-M, CP), exclusivamente.", "C": "Frustração do caráter competitivo de licitação (art. 337-F, CP), com idêntica gravidade de pena.", "D": "Violação de sigilo em licitação (art. 337-J, CP)."}, "gabarito": "A", "fb": {"A": "Correta! O art. 337-N, CP, tipifica condutas relacionadas a irregularidades nos REGISTROS CADASTRAIS de licitantes — impedir, perturbar ou fraudar a inscrição de interessado, ou promover indevidamente alteração, suspensão ou cancelamento de registro de quem já está inscrito.", "B": "Incorreta. Contratação inidônea trata de contratar com quem JÁ FOI declarado inidôneo/impedido, situação diferente do cancelamento indevido de registro cadastral regular.", "C": "Incorreta. As penas não são idênticas — 337-F tem apenamento significativamente mais grave (4-8 anos) que a conduta de irregularidade cadastral do 337-N.", "D": "Incorreta. Não há questão de sigilo de propostas envolvida, mas de registro cadastral."}, "fund": "Art. 337-N, CP, incluído pela Lei 14.133/2021.", "caqui": "Esse crime protege os SISTEMAS DE CADASTRAMENTO de fornecedores (como o SICAF, no âmbito federal) contra manipulações indevidas — seja para impedir a inscrição legítima de um concorrente, seja para cancelar/suspender arbitrariamente o registro de quem já estava regularmente cadastrado. Sem esse tipo de proteção, um gestor mal-intencionado poderia “limpar” o cadastro de concorrentes indesejados sem qualquer justificativa legítima."}, {"num": 12, "exame": "CESPE – estilo", "titulo": "Omissão Grave de Dado por Projetista – Art. 337-O, CP", "enunciado": "Um projetista, responsável por elaborar levantamento cadastral e condições de contorno para uma obra pública de engenharia, entrega à Administração informações incorretas e desatualizadas, o que induz a Administração a decisões que ocasionam sobrepreço na celebração do contrato.", "comando": "Segundo o Código Penal, essa conduta configura o crime de:", "alt": {"A": "Contratação inidônea (art. 337-M, CP).", "B": "Omissão grave de dado ou de informação por projetista (art. 337-O, CP), crime que NÃO tinha correspondência específica na Lei 8.666/93 e representa uma inovação da Lei 14.133/2021.", "C": "Perturbação de processo licitatório (art. 337-I, CP).", "D": "Fraude em licitação ou contrato (art. 337-L, CP), exclusivamente."}, "gabarito": "B", "fb": {"A": "Incorreta. Contratação inidônea trata de outra hipótese, relacionada a empresas já declaradas inidôneas, não à elaboração de projetos de engenharia.", "B": "Correta! Art. 337-O, CP: “omitir, modificar ou entregar à Administração Pública levantamento cadastral ou condição de contorno em relevância dissonância com a realidade, em qualquer etapa da licitação ou da execução contratual, cuja resultante induza a Administração a decisões que ocasionem sobrepreço ou superfaturamento”, com pena de reclusão de 6 meses a 3 anos e multa. Trata-se de crime NOVO, sem correspondência direta na legislação revogada, voltado a punir projetistas cujas informações técnicas distorcidas geram prejuízo à Administração.", "C": "Incorreta. Não é um caso de perturbação de ato licitatório, mas de informação técnica incorreta na fase de projeto.", "D": "Incorreta. Embora haja alguma proximidade conceitual, o tipo específico criado para essa conduta é o art. 337-O, dirigido especificamente a levantamentos cadastrais e condições de contorno de projetos."}, "fund": "Art. 337-O, CP, incluído pela Lei 14.133/2021.", "caqui": "Esse é um dos crimes mais NOVOS e menos conhecidos do capítulo, criado especificamente para responsabilizar quem prepara ESTUDOS TÉCNICOS (sondagens, topografia, condições ambientais, estudos de demanda) que, por sua natureza, influenciam diretamente o preço e as condições de obras e serviços de engenharia. Se esses dados forem entregues de forma incorreta ou desatualizada e isso gerar sobrepreço/superfaturamento, o projetista responsável pode ser penalmente responsabilizado — uma novidade sem “parente próximo” na Lei 8.666/93 revogada."}, {"num": 13, "exame": "OAB – estilo FGV", "titulo": "Regra Especial de Multa – Art. 337-P, CP", "enunciado": "Após condenação por crime do Capítulo II-B do Título XI do Código Penal (crimes em licitações e contratos administrativos), discute-se qual critério deve nortear a fixação da pena de multa.", "comando": "Segundo o art. 337-P do Código Penal, a pena de multa cominada a esses crimes:", "alt": {"A": "é fixada exclusivamente em salários mínimos, sem qualquer relação com o valor do contrato.", "B": "é fixada considerando o valor do contrato licitado ou celebrado com contratação direta, observados os critérios gerais do Código Penal (sistema de dias-multa, art. 49, CP), com piso mínimo vinculado a percentual desse valor.", "C": "é sempre idêntica à pena de multa prevista para o crime de peculato.", "D": "não pode ser cumulada com a pena privativa de liberdade em nenhuma hipótese."}, "gabarito": "B", "fb": {"A": "Incorreta. A pena de multa nos crimes licitatórios tem critério ESPECÍFICO vinculado ao valor do contrato, não um valor fixo desvinculado.", "B": "Correta! Art. 337-P, CP: traz regra especial para o cálculo da pena de multa nos crimes deste capítulo, correlacionando-a ao valor do contrato licitado ou celebrado com a contratação direta, com aplicação dos critérios gerais do sistema de dias-multa do Código Penal (art. 49, CP) e previsão de piso mínimo. A Lei 14.133/2021 flexibilizou o antigo teto de 5% do valor do contrato que constava da Lei 8.666/93, permitindo aplicação mais severa em casos graves.", "C": "Incorreta. Não há essa equiparação automática à multa do peculato — o art. 337-P traz regra própria para os crimes licitatórios.", "D": "Incorreta. A pena de multa é justamente CUMULATIVA à pena privativa de liberdade em todos os tipos do capítulo (“reclusão... e multa”)."}, "fund": "Art. 337-P, CP, incluído pela Lei 14.133/2021; art. 49, CP.", "caqui": "Esse artigo não cria um crime novo — é uma REGRA DE DOSIMETRIA específica para a pena de multa de TODOS os crimes do capítulo (337-E a 337-O). A lógica é: como esses crimes geralmente envolvem vantagens econômicas ligadas ao valor do contrato público, faz sentido que a multa também seja calculada com referência a esse valor, tornando a punição proporcional ao tamanho econômico do negócio fraudado."}, {"num": 14, "exame": "CESPE – estilo", "titulo": "Sujeito Ativo dos Crimes Licitatórios", "enunciado": "Um particular, sócio de empresa licitante, sem ocupar qualquer cargo público, pratica conduta de frustração do caráter competitivo de uma licitação.", "comando": "Sobre a possibilidade de responsabilização penal desse particular pelos crimes do Capítulo II-B do Título XI do Código Penal, é correto afirmar que:", "alt": {"A": "Os crimes em licitações e contratos administrativos são crimes próprios, exigindo necessariamente a qualidade de funcionário público do agente.", "B": "Em regra, os crimes desse capítulo são crimes COMUNS, podendo ser praticados por QUALQUER PESSOA, inclusive particulares que atuem em licitações (licitantes, representantes de empresas, projetistas etc.), não apenas por agentes públicos.", "C": "Somente servidores efetivos, com estabilidade, podem responder por esses crimes.", "D": "Particulares só respondem por esses crimes se também forem condenados por improbidade administrativa no mesmo processo."}, "gabarito": "B", "fb": {"A": "Incorreta. Embora alguns tipos (como contratação direta ilegal) sejam mais tipicamente praticados por agentes públicos com poder de decisão, a doutrina majoritária classifica a maioria dos crimes do capítulo como crimes COMUNS.", "B": "Correta! A doutrina majoritária (a exemplo dos comentários sobre o art. 337-F) classifica esses crimes como COMUNS, podendo ser praticados por qualquer pessoa — agentes públicos, servidores, ou particulares (representantes de empresas licitantes, projetistas, terceiros interessados) — seja por ação direta, seja por intermédio de terceiros.", "C": "Incorreta. Não há essa restrição a servidores efetivos e estáveis.", "D": "Incorreta. A responsabilidade penal é autônoma em relação à eventual ação de improbidade administrativa — são esferas distintas (penal e cível/administrativa), não havendo dependência entre uma condenação e outra."}, "fund": "Doutrina sobre a natureza dos crimes do Capítulo II-B, Título XI, CP.", "caqui": "Isso derruba um mito comum: muita gente acha que “crime contra a Administração Pública” só pode ser cometido por servidor público. Mas, na verdade, boa parte dos crimes licitatórios protege um bem jurídico coletivo (a lisura e a competitividade das licitações) que pode ser atacado tanto por dentro (agente público) quanto por fora (empresas licitantes, representantes comerciais, projetistas contratados). O elemento subjetivo é sempre o DOLO — não há previsão de modalidade culposa em nenhum desses tipos."}, {"num": 15, "exame": "OAB – estilo FGV", "titulo": "Progressão de Regime e Reintegração ao Título XI do CP", "enunciado": "Um agente foi condenado por crime de contratação direta ilegal (art. 337-E, CP) e busca informações sobre as condições para progressão de regime no cumprimento da pena.", "comando": "Considerando que os crimes em licitações passaram a integrar o Título XI do Código Penal (Crimes contra a Administração Pública), é correto afirmar que:", "alt": {"A": "A progressão de regime independe de qualquer condição especial, aplicando-se apenas os requisitos objetivos e subjetivos gerais da Lei de Execução Penal.", "B": "A progressão de regime fica condicionada à reparação do dano que causou, ou à devolução do produto do ilícito praticado, com os acréscimos legais, nos termos do art. 33, §4º, do Código Penal, aplicável aos condenados por crime contra a Administração Pública.", "C": "A progressão de regime é automaticamente vedada para todos os crimes desse capítulo, independentemente da pena aplicada.", "D": "Somente após o pagamento integral da pena de multa é possível iniciar o cumprimento da pena privativa de liberdade."}, "gabarito": "B", "fb": {"A": "Incorreta. Existe sim uma condição especial adicional para crimes contra a Administração Pública, prevista no art. 33, §4º, CP.", "B": "Correta! Art. 33, §4º, CP (incluído pela Lei 10.763/2003): “O condenado por crime contra a administração pública terá a progressão de regime do cumprimento da pena condicionada à reparação do dano que causou, ou à devolução do produto do ilícito praticado, com os acréscimos legais”. Com a inserção dos crimes licitatórios no Título XI do CP (Crimes contra a Administração Pública), essa regra passou a se aplicar também a eles, encerrando controvérsias anteriores sobre sua aplicabilidade quando esses crimes estavam na Lei 8.666/93.", "C": "Incorreta. Não há vedação automática à progressão — apenas uma condição adicional (reparação do dano ou devolução do produto do ilícito).", "D": "Incorreta. Não há essa exigência de pagamento integral prévio da multa como condicionante para o início do cumprimento da pena privativa de liberdade."}, "fund": "Art. 33, §4º, CP; arts. 337-E a 337-O, CP.", "caqui": "Essa é uma das consequências SISTÊMICAS mais importantes da migração dos crimes licitatórios para dentro do Código Penal: como agora eles estão formalmente classificados como “crimes contra a Administração Pública” (Título XI), a regra do art. 33, §4º, CP (progressão condicionada à reparação do dano) passa a se aplicar automaticamente a eles, encerrando dúvidas doutrinárias que existiam quando esses crimes estavam “isolados” na Lei 8.666/93."}, {"num": 16, "exame": "CESPE – estilo", "titulo": "Perda do Cargo Público – Regra Aplicável", "enunciado": "Um servidor público foi condenado por crime de modificação ou pagamento irregular em contrato administrativo (art. 337-H, CP).", "comando": "Sobre a perda do cargo público como consequência dessa condenação, é correto afirmar que:", "alt": {"A": "Aplica-se ainda a regra específica do art. 83 da Lei 8.666/93, que continua em pleno vigor para esse fim.", "B": "Com a revogação da regra específica que constava do art. 83 da Lei 8.666/93, aplicam-se as normas gerais do Código Penal sobre efeitos da condenação, notadamente o art. 92, I, CP.", "C": "A perda do cargo é sempre automática, independentemente de qualquer previsão legal ou fundamentação judicial específica.", "D": "Não há mais qualquer possibilidade de perda do cargo em decorrência de condenação por esses crimes."}, "gabarito": "B", "fb": {"A": "Incorreta. O art. 83 da Lei 8.666/93, que trazia regra específica sobre perda do cargo, foi revogado juntamente com os demais dispositivos penais da lei antiga (arts. 89 a 108).", "B": "Correta! Com a revogação da regra específica da Lei 8.666/93, aplicam-se as normas GERAIS do Código Penal sobre efeitos da condenação, especialmente o art. 92, I, CP, que trata da perda de cargo, função pública ou mandato eletivo como efeito ESPECÍFICO E MOTIVADO da sentença (não automático), a depender dos requisitos legais (como quantum da pena e relação com o cargo).", "C": "Incorreta. A perda do cargo, pela regra geral do art. 92, I, CP, NÃO é efeito automático da condenação — deve ser motivadamente declarada na sentença, presentes os requisitos legais.", "D": "Incorreta. Continua sendo possível a perda do cargo, só que agora pela regra GERAL do Código Penal, não mais por regra específica da lei de licitações."}, "fund": "Art. 92, I, CP; art. 193, I, Lei 14.133/2021 (revogação do art. 83, Lei 8.666/93).", "caqui": "Mais uma consequência sistêmica da “mudança de endereço” dos crimes licitatórios: não existe mais um procedimento ou regra ESPECÍFICA de perda de cargo para esses crimes — agora tudo segue a regra GERAL do art. 92, I, do Código Penal, que exige DECLARAÇÃO MOTIVADA na sentença (não é efeito automático da condenação), presentes os requisitos legais (como aplicação de pena igual ou superior a 1 ano nos casos de abuso de poder/violação de dever, ou superior a 4 anos nos demais casos, conforme o inciso e a alínea aplicáveis)."}, {"num": 17, "exame": "OAB – estilo FGV", "titulo": "Novatio Legis in Pejus – Irretroatividade das Novas Penas", "enunciado": "Um agente praticou, em 2019 (antes da vigência da Lei 14.133/2021), conduta equivalente à atualmente descrita no art. 337-H do Código Penal (modificação irregular de contrato administrativo), à época punida com pena de 2 a 4 anos pelo art. 92 da Lei 8.666/93.", "comando": "Sobre a pena aplicável a esse agente, é correto afirmar que:", "alt": {"A": "Aplica-se a pena atual do art. 337-H, CP (4 a 8 anos), por ser a lei vigente ao tempo do julgamento.", "B": "Aplica-se a pena da lei vigente à época do fato (2 a 4 anos, art. 92, Lei 8.666/93), pois a nova pena, mais grave, configura novatio legis in pejus e não pode retroagir para prejudicar o agente, por força do princípio da irretroatividade da lei penal mais gravosa (art. 5º, XL, CF/88).", "C": "O fato se torna atípico, pois a antiga lei foi revogada.", "D": "Aplica-se sempre a pena média entre a lei antiga e a lei nova."}, "gabarito": "B", "fb": {"A": "Incorreta. É exatamente o oposto: leis penais mais gravosas NÃO retroagem, aplicando-se apenas a fatos posteriores à sua vigência.", "B": "Correta! Trata-se de aplicação do princípio constitucional da irretroatividade da lei penal mais gravosa (art. 5º, XL, CF/88: “a lei penal não retroagirá, salvo para beneficiar o réu”). Como a pena do novo art. 337-H é mais severa que a do antigo art. 92 da Lei 8.666/93, configura-se novatio legis in pejus, que SÓ SE APLICA a fatos praticados APÓS sua entrada em vigência. Para fatos anteriores, continua valendo a pena da lei revogada, por ULTRATIVIDADE da lei penal mais benéfica.", "C": "Incorreta. Não há abolitio criminis quanto à conduta em si (que continua sendo crime, recebendo novo tipo penal) — há apenas continuidade normativo-típica, com deslocação para outro dispositivo.", "D": "Incorreta. Não existe essa regra de “pena média” no ordenamento jurídico brasileiro."}, "fund": "Art. 5º, XL, CF/88; princípio da continuidade normativo-típica.", "caqui": "Esse é um ótimo exemplo de como a FGV gosta de cruzar Direito Penal com Direito Constitucional dentro do mesmo tema: a Lei 14.133/2021 aumentou várias penas na migração para o Código Penal (arts. 337-F, 337-G, 337-H, 337-I, 337-K, 337-N, entre outros). Todas essas majorações só valem para fatos praticados APÓS 1º de abril de 2021 (início da vigência). Para fatos anteriores, aplica-se a PENA MAIS BENÉFICA da lei revogada (princípio da ultratividade da lei penal mais favorável), mesmo que ela já não esteja mais formalmente em vigor."}, {"num": 18, "exame": "CESPE – estilo", "titulo": "Continuidade Normativo-Típica", "enunciado": "Discute-se, na doutrina, se a revogação dos arts. 89 a 108 da Lei 8.666/93 e sua substituição pelos arts. 337-E a 337-P do Código Penal representou abolitio criminis (descriminalização) das condutas antes tipificadas.", "comando": "Segundo a doutrina majoritária, aplicável a essa migração legislativa o princípio da:", "alt": {"A": "Abolitio criminis geral, extinguindo a punibilidade de todos os fatos pretéritos.", "B": "Continuidade normativo-típica: a conduta antes proibida permanece proibida, apenas deslocada para outro tipo penal, mantendo-se a punição (ainda que sujeita às regras de irretroatividade da lei mais gravosa quanto à pena).", "C": "Retroatividade inédita, aplicando-se sempre a lei mais gravosa a fatos pretéritos.", "D": "Inconstitucionalidade superveniente de toda a disciplina penal das licitações."}, "gabarito": "B", "fb": {"A": "Incorreta. Não houve abolitio criminis GERAL — apenas quanto a aspectos pontuais específicos (como o descumprimento de mera formalidade no antigo art. 89, que deixou de ser criminalizado no novo art. 337-E).", "B": "Correta! Pelo princípio da continuidade normativo-típica, quando uma lei revoga um tipo penal mas mantém a proibição da conduta em outro dispositivo (ainda que com nomenclatura ou redação diferente), não há descriminalização — a conduta continua sendo crime, apenas “realocada” para outro tipo penal. Isso deixa clara a intenção do legislador de manter a conduta proibida e típica.", "C": "Incorreta. Não existe essa “retroatividade inédita” genérica — continuam valendo as regras normais de irretroatividade da lei mais gravosa.", "D": "Incorreta. Não há qualquer inconstitucionalidade reconhecida na nova disciplina penal das licitações."}, "fund": "Princípio da continuidade normativo-típica (doutrina e jurisprudência penal).", "caqui": "Esse princípio é frequentemente cobrado em questões sobre reformas legislativas penais: quando o legislador REVOGA um artigo mas RECRIA a mesma conduta proibida em outro dispositivo, não há abolitio criminis — há apenas uma mudança de “endereço” da norma. A diferença prática é enorme: se fosse abolitio criminis, todos os processos em andamento por fatos antigos seriam extintos; como é continuidade normativo-típica, os processos continuam, apenas com a pena da lei vigente à época do fato (mais benéfica, em regra)."}, {"num": 19, "exame": "OAB – estilo FGV", "titulo": "Elemento Subjetivo dos Crimes Licitatórios", "enunciado": "Um servidor, agindo com negligência (sem intenção deliberada), autoriza equivocadamente uma modificação contratual irregular por erro de interpretação da legislação, sem qualquer vontade consciente de fraudar a Administração.", "comando": "Sobre a responsabilidade penal desse servidor pelo crime do art. 337-H do Código Penal, é correto afirmar que:", "alt": {"A": "Responde normalmente pelo crime, pois os crimes licitatórios admitem modalidade culposa.", "B": "Não responde pelo crime do art. 337-H, pois os crimes do Capítulo II-B do Título XI do Código Penal exigem DOLO, não havendo previsão de modalidade culposa para essas condutas.", "C": "Responde pelo crime, mas com pena reduzida pela metade, em razão da negligência.", "D": "Responde civilmente, mas nunca administrativamente, pela conduta neglicente."}, "gabarito": "B", "fb": {"A": "Incorreta. Não há previsão de modalidade culposa nos crimes do capítulo — todos exigem dolo.", "B": "Correta! Toda a doutrina sobre os crimes do Capítulo II-B é uníssona: são crimes DOLOSOS, sem previsão de modalidade culposa. Sem a vontade livre e consciente de praticar a conduta proibida (ou, em alguns tipos, sem o dolo específico de causar dano ao erário), não há crime — podendo, no máximo, haver responsabilidade administrativa/civil por conduta culposa, mas não penal nesse capítulo.", "C": "Incorreta. Não há essa figura de “pena reduzida por negligência” nos crimes dolosos do capítulo — ou há dolo (e responde integralmente) ou não há dolo (e não há crime, por ausência de previsão culposa).", "D": "Incorreta. Pode sim haver responsabilidade administrativa (e até civil, por improbidade administrativa culposa em certas hipóteses) mesmo sem responsabilidade penal — são esferas autônomas e independentes."}, "fund": "Doutrina sobre os crimes do Capítulo II-B, Título XI, CP.", "caqui": "Fixe essa regra geral para todo o capítulo: TODOS os crimes em licitações e contratos administrativos (arts. 337-E a 337-O) exigem DOLO — nenhum admite modalidade culposa. Isso significa que erro de interpretação, falha de gestão por negligência, ou mera desorganização administrativa, sem vontade consciente de fraudar, NÃO configuram esses crimes — embora possam gerar outras consequências (disciplinares, de improbidade administrativa, civis)."}, {"num": 20, "exame": "CESPE – estilo", "titulo": "Ausência de Procedimento Processual Específico", "enunciado": "Um advogado, ao atuar em processo por crime de fraude em licitação ou contrato (art. 337-L, CP), busca identificar o rito processual aplicável ao caso.", "comando": "Sobre o procedimento processual aplicável aos crimes do Capítulo II-B do Título XI do Código Penal, é correto afirmar que:", "alt": {"A": "Aplica-se o procedimento específico previsto nos arts. 100 a 108 da Lei 8.666/93, que continuam em vigor apenas para fins processuais.", "B": "Não há mais procedimento processual específico para o julgamento desses crimes — aplicam-se as regras processuais gerais do Código de Processo Penal, conforme a pena máxima cominada a cada tipo (procedimento comum ordinário, sumário ou sumaríssimo).", "C": "Esses crimes são julgados exclusivamente pelo Tribunal do Júri.", "D": "Esses crimes são julgados exclusivamente por Tribunais Superiores, em razão da gravidade."}, "gabarito": "B", "fb": {"A": "Incorreta. Os arts. 100 a 108 da Lei 8.666/93 (que tratavam do processo e julgamento) foram REVOGADOS DE IMEDIATO junto com os demais dispositivos penais, não havendo mais vigência para nenhum efeito.", "B": "Correta! Com a revogação do procedimento específico da Lei 8.666/93, os crimes do Capítulo II-B do Título XI do Código Penal passaram a seguir as regras processuais GERAIS do CPP, definidas com base na pena máxima cominada a cada tipo penal (procedimento comum ordinário para penas máximas iguais ou superiores a 4 anos, sumário para penas inferiores a 4 anos, conforme arts. 394 e seguintes, CPP).", "C": "Incorreta. Não há competência do Tribunal do Júri para esses crimes, que não são dolosos contra a vida.", "D": "Incorreta. Não há essa competência originaria de Tribunais Superiores, salvo em hipóteses de foro por prerrogativa de função do agente específico envolvido."}, "fund": "Art. 193, I, Lei 14.133/2021 (revogação dos arts. 100-108, Lei 8.666/93); arts. 394 e seguintes, CPP.", "caqui": "Mais uma simplificação trazida pela mudança: antes, a Lei 8.666/93 tinha um procedimento PRÓPRIO e específico para julgar esses crimes (arts. 100 a 108). Hoje, como os crimes estão dentro do Código Penal, eles seguem as regras processuais GERAIS do CPP, sem qualquer particularidade procedimental — exatamente como qualquer outro crime contra a Administração Pública (peculato, corrupção etc.)."}, {"num": 21, "exame": "OAB – estilo FGV", "titulo": "Norma Penal em Branco – Art. 337-E, CP", "enunciado": "Para determinar se uma contratação direta configura o crime do art. 337-E do Código Penal, é necessário verificar se as hipóteses de dispensa ou inexigibilidade previstas na legislação de licitações foram ou não observadas.", "comando": "Essa característica do tipo penal do art. 337-E, CP, é classificada, na teoria geral do Direito Penal, como:", "alt": {"A": "Norma penal em branco, pois depende de complementação por disposições extrapenais da própria legislação de licitações (Lei 14.133/2021) para se definir quando a contratação direta é legítima ou ilegal.", "B": "Tipo penal aberto, dispensando qualquer referência a normas externas para sua interpretação.", "C": "Crime de mera conduta, que prescinde de qualquer resultado naturalístico ou referência normativa externa.", "D": "Tipo penal de perigo abstrato, incompatível com a técnica de normas penais em branco."}, "gabarito": "A", "fb": {"A": "Correta! O art. 337-E, CP, é classificado pela doutrina como NORMA PENAL EM BRANCO: a expressão “fora das hipóteses previstas em lei” remete diretamente às disposições extrapenais da própria Lei 14.133/2021, que definem quando é legítima a dispensa ou inexigibilidade de licitação. Sem essa complementação normativa externa, é impossível saber se determinada contratação direta é legítima ou criminosa.", "B": "Incorreta. É exatamente o oposto — o tipo depende expressamente de complementação normativa externa.", "C": "Incorreta. A classificação quanto à forma de complementação normativa (norma penal em branco) é independente da classificação quanto ao resultado (crime de mera conduta, formal ou material) — são classificações de critérios diferentes.", "D": "Incorreta. Não há essa incompatibilidade — tipos de perigo abstrato podem perfeitamente ser também normas penais em branco."}, "fund": "Doutrina sobre normas penais em branco aplicada ao art. 337-E, CP.", "caqui": "Norma penal em branco é aquela cujo preceito primário (a descrição da conduta proibida) precisa ser COMPLEMENTADO por outra norma, para que se saiba exatamente o que é proibido. No caso do art. 337-E, o CP diz “fora das hipóteses previstas em lei” — mas quais são essas hipóteses? Isso só se descobre lendo os arts. 74 e 75 da Lei 14.133/2021 (hipóteses de inexigibilidade e dispensa de licitação). Por isso, entender o crime licitatório exige sempre conhecer, em paralelo, a legislação administrativa de licitações."}, {"num": 22, "exame": "CESPE – estilo", "titulo": "Comparação de Penas: Crimes Mais e Menos Graves do Capítulo", "enunciado": "Considerando as penas máximas cominadas aos crimes do Capítulo II-B do Título XI do Código Penal, analise os seguintes crimes: contratação direta ilegal (art. 337-E), perturbação de processo licitatório (art. 337-I) e afastamento de licitante (art. 337-K).", "comando": "Colocando esses três crimes em ordem CRESCENTE de pena máxima cominada, a sequência correta é:", "alt": {"A": "Contratação direta ilegal (8 anos) → afastamento de licitante (5 anos) → perturbação de processo licitatório (3 anos).", "B": "Perturbação de processo licitatório (3 anos) → afastamento de licitante (5 anos) → contratação direta ilegal (8 anos).", "C": "Afastamento de licitante (3 anos) → contratação direta ilegal (5 anos) → perturbação de processo licitatório (8 anos).", "D": "Os três crimes têm pena máxima idêntica de 8 anos."}, "gabarito": "B", "fb": {"A": "Incorreta. A ordem está invertida — deve ser crescente, do menor para o maior.", "B": "Correta! Perturbação de processo licitatório (art. 337-I): reclusão de 6 meses a 3 anos (pena máxima: 3 anos). Afastamento de licitante (art. 337-K): reclusão de 3 a 5 anos (pena máxima: 5 anos). Contratação direta ilegal (art. 337-E): reclusão de 4 a 8 anos (pena máxima: 8 anos). A ordem crescente é, portanto: 337-I → 337-K → 337-E.", "C": "Incorreta. Os valores atribuídos a cada crime estão incorretos.", "D": "Incorreta. As penas máximas são claramente diferentes entre os três tipos."}, "fund": "Arts. 337-E, 337-I e 337-K, CP.", "caqui": "É útil montar uma escala mental de gravidade dentro do capítulo: os crimes MAIS GRAVES (4 a 8 anos) são aqueles que atacam diretamente o núcleo da licitação — contratação direta ilegal (337-E), frustração do caráter competitivo (337-F), modificação/pagamento irregular em contrato (337-H) e fraude em licitação/contrato (337-L). Os crimes de gravidade INTERMEDIÁRIA (3 a 5 anos) incluem o afastamento de licitante (337-K). Já os crimes mais BRANDOS (6 meses a 3 anos) são perturbação de processo licitatório (337-I) e omissão grave de dado por projetista (337-O)."}, {"num": 23, "exame": "OAB – estilo FGV", "titulo": "Manutenção da Jurisprudência sobre Dolo Específico e Prejuízo", "enunciado": "A jurisprudência consolidada do STJ, formada ainda sob a vigência do antigo art. 89 da Lei 8.666/93, exigia, para a condenação por dispensa ou inexigibilidade indevida de licitação, a demonstração de dolo específico de causar dano ao erário e de efetivo prejuízo aos cofres públicos.", "comando": "Com a migração dessa conduta para o art. 337-E do Código Penal, a tendência doutrinária e jurisprudencial é:", "alt": {"A": "Abandonar completamente essa exigência, bastando a mera inobservância formal das hipóteses legais de dispensa ou inexigibilidade.", "B": "Manter a exigência de dolo específico de causar dano ao erário e de efetivo prejuízo aos cofres públicos para a caracterização do crime, dada a continuidade normativo-típica da conduta.", "C": "Exigir, adicionalmente, a condenação prévia por improbidade administrativa como condição de procedibilidade da ação penal.", "D": "Considerar o crime como de responsabilidade objetiva, dispensando qualquer análise de dolo."}, "gabarito": "B", "fb": {"A": "Incorreta. É exatamente o oposto — a jurisprudência tende a MANTER essa exigência mais rigorosa, evitando a criminalização do mero erro administrativo formal.", "B": "Correta! Como houve continuidade normativo-típica da conduta do antigo art. 89 no atual art. 337-E, a jurisprudência consolidada sob a lei anterior tende a ser mantida: exige-se dolo específico de causar dano ao erário e efetivo prejuízo aos cofres públicos, evitando-se a criminalização de meras irregularidades formais ou erros de interpretação administrativa sem intenção fraudulenta.", "C": "Incorreta. Não há essa condição de procedibilidade — a ação penal pública é independente de prévia condenação por improbidade administrativa.", "D": "Incorreta. Todos os crimes do capítulo exigem DOLO (análise subjetiva) — não há responsabilidade penal objetiva no Direito Penal brasileiro."}, "fund": "Jurisprudência do STJ sobre o art. 89 da Lei 8.666/93, aplicável por continuidade normativo-típica ao art. 337-E, CP.", "caqui": "Essa manutenção jurisprudencial é importante para EVITAR o exagero punitivo: nem todo erro ou informalidade em uma contratação pública deve virar crime — senão, qualquer gestor público que errasse na interpretação de uma hipótese de dispensa estaria sujeito a persecução penal. Por isso a exigência de DOLO ESPECÍFICO (querer especificamente causar dano ao erário) e PREJUÍZO EFETIVO funciona como um filtro que restringe a criminalização às condutas realmente fraudulentas e lesivas."}, {"num": 24, "exame": "CESPE – estilo", "titulo": "Distinção entre Fase de Licitação e Fase Contratual", "enunciado": "Considere as seguintes condutas: (1) combinar preços entre licitantes antes da abertura do certame; (2) entregar mercadoria de qualidade inferior à contratada, após a celebração do contrato.", "comando": "Essas duas condutas se relacionam, respectivamente, a qual FASE da relação entre a Administração e o particular?", "alt": {"A": "Ambas se relacionam exclusivamente à fase de execução contratual.", "B": "A primeira se relaciona à FASE LICITATÓRIA (art. 337-F, frustração do caráter competitivo), e a segunda à FASE DE EXECUÇÃO DO CONTRATO já celebrado (art. 337-L, fraude em licitação ou contrato).", "C": "Ambas se relacionam exclusivamente à fase pré-licitatória, antes da publicação do edital.", "D": "Não há distinção relevante de fase para a tipificação desses crimes."}, "gabarito": "B", "fb": {"A": "Incorreta. A primeira conduta (combinação de preços) ocorre ANTES da celebração do contrato, na própria disputa licitatória.", "B": "Correta! Essa distinção de FASE é útil para identificar o tipo penal correto: crimes como frustração do caráter competitivo (337-F), perturbação do processo licitatório (337-I), violação de sigilo (337-J) e afastamento de licitante (337-K) ocorrem NA LICITAÇÃO em si. Já crimes como fraude em licitação ou contrato na modalidade de entrega irregular (337-L) e modificação/pagamento irregular (337-H) ocorrem na EXECUÇÃO do contrato já celebrado.", "C": "Incorreta. Nenhuma das duas ocorre necessariamente antes da publicação do edital.", "D": "Incorreta. A distinção de fase é útil justamente para identificar corretamente qual tipo penal se aplica a cada conduta narrada em uma questão."}, "fund": "Arts. 337-F e 337-L, CP.", "caqui": "Uma boa estratégia de prova: ao ler o enunciado de uma questão sobre crimes licitatórios, pergunte-se primeiro em que MOMENTO a conduta ocorreu. Se foi ANTES ou DURANTE a disputa licitatória (escolha do fornecedor), pense nos arts. 337-E a 337-K. Se foi DEPOIS, já na EXECUÇÃO do contrato firmado, pense nos arts. 337-H e 337-L. Essa triagem inicial já elimina boa parte das alternativas erradas."}, {"num": 25, "exame": "OAB – estilo FGV", "titulo": "Questão Síntese – Crimes em Licitações e Contratos Administrativos", "enunciado": "Sobre os crimes em licitações e contratos administrativos, na sistemática da Lei 14.133/2021, analise as afirmativas:\n\nI. Os crimes estão previstos nos arts. 337-E a 337-P do Código Penal, dentro do Título XI (Crimes contra a Administração Pública).\nII. São, em regra, crimes próprios, somente passíveis de serem praticados por agentes públicos.\nIII. Admitem, em sua maioria, modalidade culposa, bastando a demonstração de negligência do agente.\nIV. A progressão de regime nesses crimes fica condicionada à reparação do dano ou devolução do produto do ilícito, por força do art. 33, §4º, CP.", "comando": "Estão corretas apenas as afirmativas:", "alt": {"A": "I e IV.", "B": "I, II e IV.", "C": "II e III.", "D": "I, III e IV."}, "gabarito": "A", "fb": {"A": "Correta! I está correta (arts. 337-E a 337-P, Título XI, CP). IV está correta (art. 33, §4º, CP, aplicável por serem crimes contra a Administração Pública). II está ERRADA — são, em regra, crimes COMUNS, podendo ser praticados por qualquer pessoa. III está ERRADA — são crimes DOLOSOS, sem previsão de modalidade culposa.", "B": "Incorreta. II está errada — não são crimes próprios exclusivos de agentes públicos.", "C": "Incorreta. Tanto II quanto III estão erradas.", "D": "Incorreta. III está errada — não há modalidade culposa nesses crimes."}, "fund": "Arts. 337-E a 337-P, CP; art. 33, §4º, CP.", "caqui": "Questão-síntese perfeita para fechar o tema: memorize que os crimes licitatórios (1) estão HOJE no Código Penal (não mais na Lei 8.666/93); (2) são, em regra, crimes COMUNS (qualquer pessoa pode praticar); (3) exigem sempre DOLO (nunca culpa); e (4) por estarem no Título XI (crimes contra a Administração Pública), atraem a regra do art. 33, §4º, CP sobre progressão de regime condicionada à reparação do dano. Essas quatro características resumem praticamente tudo que a OAB cobra sobre a sistemática geral do tema."}];
let cur=0,N=QUESTOES.length;
const E=Array(N).fill(null);
function init(){
  const nw=document.getElementById('nw'),ct=document.getElementById('ct');
  QUESTOES.forEach((q,i)=>{
    const b=document.createElement('button');
    b.className='nb'+(i===0?' active':'');b.textContent=i+1;b.onclick=()=>go(i);b.id='n'+i;nw.appendChild(b);
    const d=document.createElement('div');d.className='qc'+(i===0?' vis':'');d.id='c'+i;d.innerHTML=bc(q,i);ct.appendChild(d);
  });upd();us();
}
function bc(q,i){
  const al=Object.entries(q.alt).map(([l,t])=>`<button class="ab" onclick="resp(${i},'${l}',this)" data-l="${l}"><span class="all">${l}</span><span class="alt">${t}</span></button>`).join('');
  return `<div class="qh"><span class="qn">Questão ${q.num}</span>${q.exame?`<span class="qe">${q.exame}</span>`:''}</div><h2 class="qt">${q.titulo}</h2><div class="en">${q.enunciado}</div><p class="co">${q.comando}</p><div class="al" id="a${i}">${al}</div><div class="fb" id="f${i}"></div><div class="fu" id="u${i}"><h4>📖 Fundamento legal</h4>${q.fund}</div><div class="cx" id="x${i}"><h4>🍊 Explicação didática do Professor Caqui</h4>${q.caqui}</div><div class="ca"><div class="bg"><button class="btn az" id="bu${i}" onclick="tF(${i})">Ver fundamento legal</button><button class="btn cq" id="bx${i}" onclick="tX(${i})">Explicação do Prof. Caqui</button><button class="btn" id="br${i}" onclick="rst(${i})">↺ Tentar novamente</button></div><span class="st" id="s${i}"></span></div>`;
}
function resp(i,l,btn){
  if(E[i]!==null)return;E[i]=l;const q=QUESTOES[i];
  document.querySelectorAll(`#a${i} .ab`).forEach(b=>{b.disabled=true;if(b.dataset.l===q.gabarito)b.classList.add('cor');if(b.dataset.l===l&&l!==q.gabarito)b.classList.add('err');});
  const ok=l===q.gabarito,f=document.getElementById('f'+i);
  f.className='fb sh '+(ok?'ac':'er');f.innerHTML=`<strong>${ok?'✓ Correta!':'✗ Incorreta.'}</strong> ${q.fb[l]}`;
  document.getElementById('s'+i).textContent=ok?'Acerto!':'Gabarito: '+q.gabarito;
  document.getElementById('br'+i).className='btn sh';document.getElementById('bu'+i).className='btn az sh';document.getElementById('bx'+i).className='btn cq sh';
  const nb=document.getElementById('n'+i);nb.classList.remove('active');nb.classList.add(ok?'ok':'no');if(i===cur)nb.classList.add('active');us();
}
function tF(i){const b=document.getElementById('u'+i),t=document.getElementById('bu'+i),v=b.classList.contains('sh');b.className=v?'fu':'fu sh';t.textContent=v?'Ver fundamento legal':'Ocultar fundamento';}
function tX(i){const b=document.getElementById('x'+i),t=document.getElementById('bx'+i),v=b.classList.contains('sh');b.className=v?'cx':'cx sh';t.textContent=v?'Explicação do Prof. Caqui':'Ocultar explicação';}
function rst(i){
  E[i]=null;document.querySelectorAll(`#a${i} .ab`).forEach(b=>{b.disabled=false;b.className='ab';});
  document.getElementById('f'+i).className='fb';document.getElementById('u'+i).className='fu';
  document.getElementById('bu'+i).className='btn az';document.getElementById('bu'+i).textContent='Ver fundamento legal';
  document.getElementById('x'+i).className='cx';document.getElementById('bx'+i).className='btn cq';document.getElementById('bx'+i).textContent='Explicação do Prof. Caqui';
  document.getElementById('br'+i).className='btn';document.getElementById('s'+i).textContent='';
  document.getElementById('n'+i).className='nb'+(i===cur?' active':'');us();
}
function go(i){document.getElementById('c'+cur).classList.remove('vis');document.getElementById('n'+cur).classList.remove('active');cur=i;document.getElementById('c'+cur).classList.add('vis');document.getElementById('n'+cur).classList.add('active');upd();window.scrollTo({top:0,behavior:'smooth'});}
function nav(d){const n=cur+d;if(n>=0&&n<N)go(n);}
function upd(){document.getElementById('pi').textContent=(cur+1)+' de '+N;document.getElementById('bp').disabled=cur===0;document.getElementById('bn').disabled=cur===N-1;}
function us(){const r=E.filter(e=>e!==null).length,a=E.filter((e,i)=>e===QUESTOES[i].gabarito).length;document.getElementById('sc-t').textContent=r;document.getElementById('sc-a').textContent=a;document.getElementById('sc-e').textContent=r-a;const p=Math.round((r/N)*100);document.getElementById('pf').style.width=p+'%';document.getElementById('pl').textContent=r+' de '+N+' respondidas';}
init();
</script>
